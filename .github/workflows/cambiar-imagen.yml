name: Cambiar Banner del Perfil

on:
  schedule:
    # Se ejecuta cada 5 horas
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite probar la rotación manualmente desde Actions

jobs:
  actualizar-imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Rotar a la siguiente imagen secuencialmente
        run: |
          # 1. Verificar cuál es la última imagen usada (guardada en .ultimo_bloque)
          if [ -f .ultimo_bloque ]; then
            ULTIMO=$(cat .ultimo_bloque)
          else
            ULTIMO=3  # Si no existe el archivo, asumimos 3 para empezar en 1
          fi

          # 2. Calcular el siguiente bloque en ciclo (1 -> 2 -> 3 -> 1)
          SIGUIENTE=$(( (ULTIMO % 3) + 1 ))

          echo "Último bloque mostrado: $ULTIMO"
          echo "Copiando imagenes/bloque${SIGUIENTE}.png hacia banner-actual.png..."

          # 3. Copiar la nueva imagen al banner principal
          cp "imagenes/bloque${SIGUIENTE}.png" banner-actual.png

          # 4. Guardar el estado del bloque actual para la próxima ejecución
          echo $SIGUIENTE > .ultimo_bloque

      - name: Guardar y publicar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner-actual.png .ultimo_bloque
          
          # Realizar el commit del cambio
          git diff --staged --quiet || (git commit -m "chore: rotar banner a la siguiente imagen" && git push)
