name: Cambiar Banner del Perfil

on:
  schedule:
    # Se ejecuta cada 5 horas para revisar la hora local
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite ejecutar el cambio manualmente desde Actions

jobs:
  actualizar-imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Cambiar imagen (3 bloques) (America/Bogota)
        run: |
          # Obtener la hora actual en número (0 a 23)
          HORA=$(TZ="America/Bogota" date +%k | tr -d ' ')
          echo "Hora actual en Colombia: $HORA:00"

          # Evaluación de los 3 bloques principales
          if [ $HORA -ge 0 ] && [ $HORA -lt 8 ]; then
            cp imagenes/bloque1.png banner-actual.png
          elif [ $HORA -ge 8 ] && [ $HORA -lt 16 ]; then
            cp imagenes/bloque2.png banner-actual.png
          else
            cp imagenes/bloque3.png banner-actual.png
          fi

      - name: Guardar y publicar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner-actual.png
          
          # Solo hace commit si banner-actual.png cambió respecto al que estaba guardado
          git diff --staged --quiet || (git commit -m "chore: actualizar banner dinámico del perfil" && git push)
